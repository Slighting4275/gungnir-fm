[workspace]
members = ["crates/core-vfs", "crates/backends", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later AND AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
core-vfs = { path = "crates/core-vfs" }
backends = { path = "crates/backends" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util", "process", "signal"] }
tokio-util = "0.7"
notify = "8"
libc = "0.2"
slint = { version = "1.18", features = ["image-default-formats", "backend-qt", "backend-winit"] }
slint-build = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
toml = "1"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
