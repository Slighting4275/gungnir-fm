workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:
  image: archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
  timeout: 1 hour
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script:
    - scripts/ci-verify setup
  script:
    - scripts/ci-verify check
