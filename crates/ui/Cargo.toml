[package]
name = "gungnir-fm"
description = "Gungnir FM: a fast dual-pane Linux file manager in Rust and Slint, companion to Gungnir VFS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gungnir-fm"

[dependencies]
core-vfs.workspace = true
backends.workspace = true
tokio.workspace = true
tokio-util.workspace = true
slint.workspace = true
libc.workspace = true
zbus = { version = "6.1", default-features = false, features = ["tokio", "proxy"] }
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
toml.workspace = true
sha2.workspace = true
sha1.workspace = true
md5.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Test fixtures only (a crafted PNG); both already in Cargo.lock through image.
crc32fast = "1.5"
flate2 = "1.1"
