[workspace]
members = ["crates/core-vfs", "crates/backends", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
core-vfs = { path = "crates/core-vfs" }
backends = { path = "crates/backends" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
tokio-util = "0.7"
notify = "8"
libc = "0.2"
slint = "1.18"
slint-build = "1.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
