app-id: org.gungnir.GungnirFM
runtime: org.freedesktop.Platform
runtime-version: '26.08'
# Only staging runs here; Rust and Zig compilation runs in the local release builder.
sdk: org.freedesktop.Platform
command: gungnir-fm-wrapper
finish-args:
  - --filesystem=host
  - --filesystem=xdg-run/gungnir:create
  - --filesystem=xdg-run/gvfsd
  - --filesystem=xdg-run/gvfs
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=GUNGNIR_PACKAGE_FORMAT=flatpak
modules:
  - name: gungnir-fm
    buildsystem: simple
    build-commands:
      - cp -a . /app/
    sources:
      # Generated by packaging/release/build.py prepare; includes FM, VFS and libraries.
      - type: dir
        path: ../../.build/release/payload
