name: gungnir-fm
base: core24
version: '0.1.5'
summary: Dual-pane file manager with Gungnir VFS
description: |
  Nemo-style file management with document templates, folder creation,
  undo and redo, and a bundled Gungnir VFS daemon and private runtime.
grade: stable
confinement: classic
platforms:
  amd64:
apps:
  gungnir-fm:
    command: bin/gungnir-fm-wrapper
    desktop: share/applications/org.gungnir.GungnirFM.desktop
    environment:
      GUNGNIR_PACKAGE_FORMAT: snap
parts:
  # Run packaging/release/build.py prepare first; compile locally once for all formats.
  payload:
    plugin: dump
    source: .build/release/payload
